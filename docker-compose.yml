name: medopros-unified

services:
  medopros:
    build: .
    container_name: medopros_unified
    ports:
      - "8001:8001"
    volumes:
      - ${HOME}/.cache:/root/.cache
      - ./data:/app/data
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Yekaterinburg
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
